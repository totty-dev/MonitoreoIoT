services:
  backend:
    build:
      context: .
      dockerfile: backend.Dockerfile
    ports:
      - "BACKEND_PORT:BACKEND_PORT"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DB_URL=
      - DB_USER=
      - DB_PASSWORD=
      - MQTT_BROKER=
      - MQTT_TOPIC1=
      - MQTT_TOPIC2=
      - QOS=
      - BACKEND_PORT=
      - BACKEND_CONTEXT_PATH=
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend.Dockerfile
    ports:
      - "FRONT_PORT:80"
    restart: unless-stopped
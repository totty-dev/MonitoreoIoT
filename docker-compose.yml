services:
  backend:
    build:
      context: .
      dockerfile: backend.Dockerfile
    ports:
      - "${BACKEND_PORT}:${BACKEND_PORT}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DB_URL=${DB_URL}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - MQTT_IP=${MQTT_IP}
      - MQTT_PORT=${MQTT_PORT}
      - MQTT_TOPIC1=${MQTT_TOPIC1}
      - MQTT_TOPIC2=${MQTT_TOPIC2}
      - MQTT_QOS=${MQTT_QOS}
      - BACKEND_PORT=${BACKEND_PORT}
      - BACKEND_IP=${BACKEND_IP}
      - BACKEND_CONTEXT_PATH=${BACKEND_CONTEXT_PATH}
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend.Dockerfile
    ports:
      - "${FRONT_PORT}:80"
    environment:
      - ESP32_IP=${ESP32_IP}
      - MQTT_IP=${MQTT_IP}
      - BACKEND_PORT=${BACKEND_PORT}
      - BACKEND_CONTEXT_PATH=${BACKEND_CONTEXT_PATH}
    restart: unless-stopped